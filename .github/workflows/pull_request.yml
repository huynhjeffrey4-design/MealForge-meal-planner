name: Pull Request

on:
  pull_request:

jobs:
  validate-lint: 
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: curl, openssl, pdo, pdo_sqlite, mbstring, xml, session
        coverage: xdebug
        tools: composer:v2

    - name: Validate composer.json and composer.lock
      run: composer validate

    - name: Lint
      run: find . -name "*.php" -type f -exec php -l {} \;

  test-unit:
    runs-on: ubuntu-latest

    needs: [validate-lint]

    env:
      PROVIDER_RECIPE: mock
      PROVIDER_USER: mock

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: curl, openssl, pdo, pdo_sqlite, mbstring, xml, session
        coverage: xdebug
        tools: composer:v2

    - name: Validate composer.json and composer.lock
      run: composer validate

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-interaction --no-suggest

    - name: Run tests
      run: ./scripts/test_unit.sh


  test-acceptance:
    runs-on: ubuntu-latest
    needs: [validate-lint]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: cse442_2025_spring_team_v_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3


    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, mbstring, openssl, pdo, pdo_mysql
          ini-values: memory_limit=-1, date.timezone='UTC'
          coverage: xdebug
          tools: composer:v2

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-suggest

      - name: Start application
        run: php -S 0.0.0.0:8080 -t . &

      - name: Take a break
        run: sleep 10

      - name: Run acceptance tests
        run: php vendor/bin/codecept run Acceptance
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: cse442_2025_spring_team_v_db
          DB_USERNAME: root
          DB_PASSWORD: password
