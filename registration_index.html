<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MealForge - Registration</title>
    <link rel="stylesheet" href="/CSE442/2025-Spring/cse-442v/style.css">
</head>
<body>
    <div class="registration-container">
        <div class="image-grid">
            <img src="/CSE442/2025-Spring/cse-442v/placeholder-1.jpg" alt="Food 1">
            <img src="/CSE442/2025-Spring/cse-442v/placeholder-2.jpg" alt="Food 2">
            <img src="/CSE442/2025-Spring/cse-442v/placeholder-3.jpg" alt="Food 3">
            <img src="/CSE442/2025-Spring/cse-442v/placeholder-4.jpg" alt="Food 4">
        </div>

        <div class="form-section">
            <h1>Create a <span class="brand">MealForge</span> Profile</h1>
            <p>Get started on your meal prep journey today - for free!</p>

            <form id="registrationForm" novalidate>
                <div class="form-group">
                    <label for="firstName">First name</label>
                    <input type="text" id="firstName" name="firstName" required>
                    <div class="error-message" id="firstNameError"></div>
                </div>

                <div class="form-group">
                    <label for="lastName">Last name</label>
                    <input type="text" id="lastName" name="lastName" required>
                    <div class="error-message" id="lastNameError"></div>
                </div>

                <div class="form-group">
                    <label for="birthdate">Birthdate</label>
                    <input type="date" id="birthdate" name="birthdate" required>
                    <div class="error-message" id="birthdateError"></div>
                </div>

                <div class="form-group">
                    <label for="country">Country</label>
                    <input type="text" id="country" name="country" required>
                    <div class="error-message" id="countryError"></div>
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" name="address" required>
                    <div class="error-message" id="addressError"></div>
                </div>

                <div class="form-group">
                    <label for="email">Email (username)</label>
                    <input type="email" id="email" name="email" required>
                    <div class="error-message" id="emailError"></div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                    <div class="error-message" id="passwordError"></div>
                </div>

                <div class="form-group">
                    <label for="phone">Phone (optional)</label>
                    <input type="tel" id="phone" name="phone">
                    <div class="error-message" id="phoneError"></div>
                </div>

                <button type="submit" class="register-btn">Register now</button>
                <div class="error-message" id="generalError"></div>
            </form>

            <div class="login-link">
                Already have an account? <a href="/CSE442/2025-Spring/cse-442v/login">Login</a>
            </div>
        </div>
    </div>

    <script src="/CSE442/2025-Spring/cse-442v/script.js"></script>
</body>
</html>
